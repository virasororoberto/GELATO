<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#2E2320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Gelato del Paseo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍦</text></svg>">
<style>
:root{
  --leche:#FAF8F5;
  --papel:#FFFFFF;
  --cacao:#2E2320;
  --cacao-medio:#6B5A52;
  --cacao-suave:#A3948C;
  --linea:#EBE4DD;
  --pistacho:#5E8C4F;
  --pistacho-claro:#EDF3EA;
  --frambuesa:#C4426B;
  --frambuesa-claro:#FBEEF2;
  --dulce:#D68E32;
  --dulce-claro:#FBF1E3;
  --sombra:0 1px 2px rgba(46,35,32,.04), 0 8px 24px rgba(46,35,32,.06);
  --sombra-alta:0 2px 8px rgba(46,35,32,.10), 0 16px 40px rgba(46,35,32,.12);
  --r:18px;
  --r-s:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--leche);color:var(--cacao);
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{
  width:100%;padding:14px 16px;border:1.5px solid var(--linea);border-radius:var(--r-s);
  background:var(--papel);outline:none;font-weight:500;
}
input:focus,select:focus,textarea:focus{border-color:var(--pistacho);box-shadow:0 0 0 3px var(--pistacho-claro)}
:focus-visible{outline:3px solid var(--pistacho);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}
.oculto{display:none !important}

/* ---------- LOGIN ---------- */
#login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;max-width:420px;margin:0 auto}
.marca{text-align:center;margin-bottom:40px}
.marca .bochas{font-size:56px;line-height:1;margin-bottom:12px}
.marca h1{font-size:32px;font-weight:600}
.marca p{color:var(--cacao-suave);margin:6px 0 0;font-size:15px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:14px;font-weight:500;color:var(--cacao-medio);margin-bottom:6px}

/* ---------- SHELL ---------- */
#app{display:none;min-height:100dvh;flex-direction:column;padding-bottom:calc(76px + var(--safe-b))}
header.top{
  position:sticky;top:0;z-index:40;background:rgba(250,248,245,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--linea);
  padding:14px 18px;display:flex;align-items:center;gap:12px;
}
header.top h2{font-size:20px;flex:1}
.chip-user{
  display:flex;align-items:center;gap:8px;background:var(--papel);border:1px solid var(--linea);
  border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:500;color:var(--cacao-medio);
}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--cacao);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
main{flex:1;padding:18px;max-width:900px;width:100%;margin:0 auto}

nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--linea);display:flex;
  padding:8px 6px calc(8px + var(--safe-b));
}
nav.tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:12px;color:var(--cacao-suave);font-size:11px;font-weight:500;
}
nav.tabs button .ic{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--cacao)}
nav.tabs button.on .ic{transform:translateY(-1px)}

/* ---------- BLOQUES ---------- */
.tarjeta{background:var(--papel);border-radius:var(--r);padding:18px;box-shadow:var(--sombra);margin-bottom:14px}
.tarjeta.plana{box-shadow:none;border:1px solid var(--linea)}
.tit-seccion{font-size:13px;font-weight:600;color:var(--cacao-suave);margin:24px 0 10px;letter-spacing:.01em}
.tit-seccion:first-child{margin-top:0}

.dato{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--linea)}
.dato:last-child{border-bottom:none}
.dato span{color:var(--cacao-medio);font-size:15px}
.dato b{font-weight:600;font-variant-numeric:tabular-nums}
.dato.total{border-top:1.5px solid var(--cacao);border-bottom:none;margin-top:6px;padding-top:14px}
.dato.total span{color:var(--cacao);font-weight:600}
.dato.total b{font-size:22px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metrica{background:var(--papel);border-radius:var(--r);padding:16px;box-shadow:var(--sombra)}
.metrica .rot{font-size:13px;color:var(--cacao-suave);font-weight:500}
.metrica .val{font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.metrica .val.chico{font-size:20px}
.metrica .pie{font-size:12px;color:var(--cacao-suave);margin-top:2px}
.metrica.destacada{background:var(--cacao);color:var(--leche)}
.metrica.destacada .rot,.metrica.destacada .pie{color:rgba(250,248,245,.65)}

/* ---------- BOTONES ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:16px;border-radius:var(--r-s);font-weight:600;font-size:16px;
  background:var(--cacao);color:var(--leche);transition:transform .08s ease;
}
.btn:active{transform:scale(.985)}
.btn.secundario{background:var(--papel);color:var(--cacao);border:1.5px solid var(--linea)}
.btn.verde{background:var(--pistacho);color:#fff}
.btn.peligro{background:var(--frambuesa-claro);color:var(--frambuesa);border:1.5px solid #F2D5DF}
.btn.chico{padding:10px 14px;font-size:14px;width:auto}
.btn:disabled{opacity:.4;pointer-events:none}
.fila-btn{display:flex;gap:10px;margin-bottom:14px}
.fila-btn .btn{flex:1}

/* ---------- VENTA ---------- */
.categorias{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.cat{
  background:var(--papel);border-radius:var(--r);padding:20px 16px;text-align:left;
  box-shadow:var(--sombra);display:flex;flex-direction:column;gap:10px;min-height:104px;
  border:2px solid transparent;transition:border-color .12s,transform .08s;
}
.cat:active{transform:scale(.98)}
.cat.on{border-color:var(--cacao)}
.cat .em{font-size:30px;line-height:1}
.cat .nom{font-weight:600;font-size:17px}
.cat.apagada{opacity:.42;box-shadow:none;border:1.5px dashed var(--linea);background:transparent}
.cat.apagada .prox{font-size:11px;color:var(--cacao-suave)}

.productos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{
  background:var(--papel);border-radius:var(--r-s);padding:16px 14px;text-align:left;
  border:1.5px solid var(--linea);display:flex;flex-direction:column;gap:6px;min-height:84px;
  justify-content:space-between;transition:transform .08s;
}
.prod:active{transform:scale(.97);border-color:var(--cacao)}
.prod .pn{font-weight:600;font-size:15px;line-height:1.2}
.prod .pp{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;color:var(--pistacho)}

/* ---------- SABORES ---------- */
.sabores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sabor{
  display:flex;align-items:center;gap:11px;background:var(--papel);border:1.5px solid var(--linea);
  border-radius:var(--r-s);padding:13px 12px;text-align:left;font-weight:500;font-size:15px;
  transition:transform .08s;
}
.sabor:active{transform:scale(.97)}
.sabor.elegido{border-color:var(--cacao);background:var(--cacao);color:var(--leche)}
.sabor.sinstock{opacity:.45}
.bocha{
  width:26px;height:26px;border-radius:50%;flex:none;
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.14), inset 0 2px 4px rgba(255,255,255,.35);
}
.bocha.mini{width:14px;height:14px}
.bocha.grande{width:34px;height:34px}
.contador-sabor{
  font-size:13px;color:var(--cacao-suave);text-align:center;margin:0 0 14px;font-weight:500;
}

/* ---------- CARRITO ---------- */
.carrito-item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--linea)}
.carrito-item:last-of-type{border-bottom:none}
.carrito-item .ci-nom{flex:1;font-weight:500}
.carrito-item .ci-sab{font-size:12.5px;color:var(--cacao-suave);display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:3px}
.carrito-item .ci-pre{font-weight:600;font-variant-numeric:tabular-nums}
.quitar{color:var(--cacao-suave);font-size:19px;padding:0 4px;line-height:1}
.barra-cobrar{
  position:fixed;left:0;right:0;bottom:calc(68px + var(--safe-b));z-index:45;padding:0 14px 10px;
}
.barra-cobrar .btn{
  box-shadow:var(--sombra-alta);padding:18px;font-size:17px;justify-content:space-between;
}
.barra-cobrar .btn .tot{font-size:21px;font-variant-numeric:tabular-nums}

/* ---------- HOJA / MODAL ---------- */
.velo{position:fixed;inset:0;background:rgba(46,35,32,.42);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.hoja{
  background:var(--leche);width:100%;max-width:520px;border-radius:24px 24px 0 0;
  padding:22px 18px calc(22px + var(--safe-b));max-height:92dvh;overflow-y:auto;
  animation:subir .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes subir{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.hoja{animation:none}}
.hoja h3{font-size:20px;margin-bottom:4px}
.hoja .sub{color:var(--cacao-medio);font-size:14px;margin:0 0 18px}
.tirador{width:38px;height:4px;background:var(--linea);border-radius:2px;margin:-8px auto 16px}
.medios{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.medio{background:var(--papel);border:1.5px solid var(--linea);border-radius:var(--r-s);padding:16px 12px;font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px}
.medio:active{border-color:var(--cacao)}
.medio .em{font-size:22px}

/* ---------- ESTADOS / SEMAFORO ---------- */
.pildora{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.pildora.ok{background:var(--pistacho-claro);color:var(--pistacho)}
.pildora.medio{background:var(--dulce-claro);color:var(--dulce)}
.pildora.mal{background:var(--frambuesa-claro);color:var(--frambuesa)}
.pildora.neutro{background:var(--linea);color:var(--cacao-medio)}

.linea-stock{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--linea)}
.linea-stock:last-child{border-bottom:none}
.linea-stock .ls-nom{flex:1;font-weight:500}
.linea-stock .ls-can{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.barrita{height:5px;background:var(--linea);border-radius:3px;overflow:hidden;margin-top:5px}
.barrita i{display:block;height:100%;border-radius:3px;background:var(--pistacho)}

/* ---------- META / MOTIVACIONAL ---------- */
.meta-card{
  background:var(--cacao);color:var(--leche);border-radius:24px;padding:26px 22px;margin-bottom:16px;
}
.meta-card .mes{font-size:14px;color:rgba(250,248,245,.6);font-weight:500}
.meta-card .facturado{font-size:44px;font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.05;margin:6px 0 2px}
.meta-card .de{font-size:15px;color:rgba(250,248,245,.62);font-variant-numeric:tabular-nums}
.progreso{height:12px;background:rgba(250,248,245,.16);border-radius:99px;overflow:hidden;margin:20px 0 10px}
.progreso i{display:block;height:100%;background:var(--pistacho);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.progreso i.super{background:linear-gradient(90deg,var(--pistacho),var(--dulce))}
.meta-card .falta{font-size:15px;font-weight:500}
.premio-box{background:rgba(250,248,245,.1);border-radius:16px;padding:16px;margin-top:18px}
.premio-box .rot{font-size:13px;color:rgba(250,248,245,.62)}
.premio-box .val{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em}

/* ---------- TABLA / LISTAS ---------- */
.lista-mov{background:var(--papel);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden}
.mov{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--linea);width:100%;text-align:left}
.mov:last-child{border-bottom:none}
.mov .mv-i{flex:1;min-width:0}
.mov .mv-t{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .mv-s{font-size:12.5px;color:var(--cacao-suave);margin-top:1px}
.mov .mv-m{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mov.anulada .mv-t{text-decoration:line-through;color:var(--cacao-suave)}

.vacio{text-align:center;padding:40px 20px;color:var(--cacao-suave)}
.vacio .em{font-size:38px;display:block;margin-bottom:10px;opacity:.7}
.vacio p{margin:0;font-size:15px}

.aviso{border-radius:var(--r-s);padding:13px 15px;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.aviso.info{background:var(--pistacho-claro);color:#3D5F33}
.aviso.alerta{background:var(--dulce-claro);color:#8A5A15}
.aviso.error{background:var(--frambuesa-claro);color:var(--frambuesa)}

.estado-red{
  position:fixed;top:0;left:0;right:0;z-index:80;text-align:center;
  font-size:13px;font-weight:600;padding:7px;background:var(--dulce);color:#fff;
}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--safe-b));z-index:90;
  background:var(--cacao);color:var(--leche);padding:13px 20px;border-radius:999px;
  font-weight:500;font-size:14.5px;box-shadow:var(--sombra-alta);max-width:90vw;text-align:center;
}
.subtabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{
  white-space:nowrap;padding:9px 15px;border-radius:999px;background:var(--papel);
  border:1.5px solid var(--linea);font-size:14px;font-weight:500;color:var(--cacao-medio);flex:none;
}
.subtabs button.on{background:var(--cacao);border-color:var(--cacao);color:var(--leche)}

.mini-tabla{width:100%;border-collapse:collapse;font-size:14.5px}
.mini-tabla th{text-align:left;font-weight:600;color:var(--cacao-suave);font-size:12.5px;padding:0 8px 8px 0}
.mini-tabla td{padding:10px 8px 10px 0;border-top:1px solid var(--linea);font-variant-numeric:tabular-nums}
.mini-tabla td:last-child,.mini-tabla th:last-child{text-align:right;padding-right:0}

.barras-h{display:flex;flex-direction:column;gap:10px}
.barra-h .bh-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.barra-h .bh-top b{font-variant-numeric:tabular-nums;font-weight:600}
.barra-h .bh-riel{height:8px;background:var(--linea);border-radius:99px;overflow:hidden}
.barra-h .bh-riel i{display:block;height:100%;background:var(--cacao);border-radius:99px}

.horas{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:8px}
.horas .h{flex:1;background:var(--pistacho-claro);border-radius:4px 4px 0 0;position:relative;min-height:3px}
.horas .h.top{background:var(--pistacho)}
.horas-rot{display:flex;justify-content:space-between;font-size:11px;color:var(--cacao-suave);margin-top:6px}

@media(min-width:640px){
  .productos,.sabores,.categorias{grid-template-columns:repeat(3,1fr)}
  main{padding:24px}
  .grid2{gap:14px}
}
</style>
<style>
/* --- Añadidos de la revisión funcional --- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{
  padding:9px 13px;border-radius:999px;background:var(--papel);border:1.5px solid var(--linea);
  font-size:14px;font-weight:500;color:var(--cacao-medio);
}
.chips button.on{background:var(--cacao);border-color:var(--cacao);color:var(--leche)}
.tecla-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tecla-grid button{
  padding:16px;border-radius:var(--r-s);background:var(--papel);border:1.5px solid var(--linea);
  font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;
}
.tecla-grid button:active{background:var(--linea)}
.visor{
  background:var(--papel);border:1.5px solid var(--linea);border-radius:var(--r-s);
  padding:18px;text-align:right;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;margin-bottom:4px;
}
.visor small{display:block;font-size:13px;font-weight:500;color:var(--cacao-suave);letter-spacing:0}
.item-acciones{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.item-acciones button{
  font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;
  background:var(--linea);color:var(--cacao-medio);
}
.et{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:1px}
.et.cortesia{background:var(--frambuesa-claro);color:var(--frambuesa)}
.et.interno{background:var(--dulce-claro);color:#8A5A15}
.et.desc{background:var(--pistacho-claro);color:var(--pistacho)}
.et.dev{background:var(--linea);color:var(--cacao-medio)}
.tachado{text-decoration:line-through;color:var(--cacao-suave);font-weight:500;margin-right:6px}
.sync{
  position:fixed;top:10px;right:12px;z-index:70;font-size:11.5px;font-weight:600;
  background:rgba(255,255,255,.92);border:1px solid var(--linea);border-radius:999px;
  padding:4px 10px;color:var(--cacao-medio);box-shadow:var(--sombra);
}
.buscador{position:relative;margin-bottom:14px}
.buscador input{padding-left:40px}
.buscador::before{content:'🔎';position:absolute;left:14px;top:14px;font-size:15px;opacity:.5}
.billetes{display:grid;grid-template-columns:1fr 72px 96px;gap:8px;align-items:center;margin-bottom:8px}
.billetes .den{font-weight:600;font-variant-numeric:tabular-nums}
.billetes input{padding:10px;text-align:center}
.billetes .sub{text-align:right;font-variant-numeric:tabular-nums;color:var(--cacao-medio);font-weight:500}
.perm{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--linea);gap:12px}
.perm:last-child{border-bottom:none}
.perm .pt{font-weight:500;font-size:15px}
.perm .pd{font-size:12.5px;color:var(--cacao-suave)}
.switch{width:50px;height:30px;border-radius:99px;background:var(--linea);position:relative;flex:none;transition:background .15s}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch.on{background:var(--pistacho)}
.switch.on i{left:23px}
.agotado{position:relative;opacity:.5}
.agotado::after{
  content:'AGOTADO';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);
  font-size:11px;font-weight:700;color:var(--frambuesa);background:var(--frambuesa-claro);
  padding:3px 8px;border-radius:5px;
}

function plata(n, signo = true) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0;

  return (neg ? '-' : '') + (signo ? '$' : '') + s;

function plataCorta(n) {
  if (n === null || isNaN(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1000000) return '$' + (n / 1000000).toFixed(a >= 10000000 ? 1 : 2).replace('.', ',') + 'M';
  if (a >= 1000) return '$' + Math.round(n / 1000) + 'k';

/* ---------- 4. ALMACENAMIENTO ---------- */
const CLAVE = 'gelato_del_paseo_v1';
/* Cada movimiento es un registro independiente: dos dispositivos pueden vender
   al mismo tiempo sin pisarse. El catálogo y la configuración sí van juntos. */
const COLECCIONES = ['ventas', 'cajas', 'movCaja', 'movStock', 'compras', 'gastos',
  'retiros', 'pagos', 'devoluciones', 'inventarios', 'inversiones', 'cierres', 'auditoria'];
const CATALOGO = ['config', 'permisos', 'mediosPago', 'motivos', 'proveedores', 'usuarios',
  'socios', 'categorias', 'productos', 'sabores', 'insumos', 'recetas', 'promos'];

let DB = null, FB = null, colaSync = [], sincronizando = false;

function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify(DB)); }
  catch (e) { toast('No se pudo guardar en el dispositivo'); console.error(e); }
  if (FB) vaciarCola();
  pintarSync();
}
/* Agrega un registro a una colección y lo deja listo para sincronizar */
function registrar(col, obj) {
  obj.id = obj.id || uid();
  DB[col].unshift(obj);
  if (DB[col].length > 4000) DB[col].length = 4000;
  colaSync.push({ col, id: obj.id });
  guardar();
  return obj;
}
function actualizar(col, obj) {
  colaSync.push({ col, id: obj.id });
  guardar();
}

function cargar() {
  const crudo = localStorage.getItem(CLAVE);
  if (crudo) {
    try { DB = JSON.parse(crudo); migrar(); return; }
    catch (e) { console.error('Datos ilegibles, se recrean', e); }
  }
  DB = datosIniciales();
  /* Arranca vacío, listo para cargar la operación real.
     sembrarDemo() queda disponible por si alguna vez se quiere
     volver a ver la app con datos de ejemplo, pero no se llama. */
  guardar();
}
/* Completa lo que falte al abrir una base guardada por una versión anterior */
function migrar() {
  const base = datosIniciales();
  for (const k in base) if (DB[k] === undefined) DB[k] = base[k];
  for (const k in base.config) if (DB.config[k] === undefined) DB.config[k] = base.config[k];
  for (const k in base.permisos) if (DB.permisos[k] === undefined) DB.permisos[k] = base.permisos[k];
  if (DB.config.comisiones && !DB.mediosPago.some(m => m.migrado)) {
    DB.mediosPago.forEach(m => {
      if (DB.config.comisiones[m.nombre] !== undefined) m.comision = DB.config.comisiones[m.nombre];
      m.migrado = true;
    });
    delete DB.config.comisiones;
  }
  DB.sabores.forEach((s, i) => {
    if (s.orden === undefined) s.orden = i + 1;
    if (s.agotado === undefined) s.agotado = false;
  });
  DB.ventas.forEach(v => {
    v.items.forEach(it => {
      if (it.precioLista === undefined) it.precioLista = it.precio;
      if (it.tipo === undefined) it.tipo = 'venta';
    });
  });
}

/* ---------- Firebase: una colección por entidad ---------- */
async function iniciarFB() {
  if (!FIREBASE_CONFIG) return;
  try {
    await cargarScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await cargarScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    firebase.initializeApp(FIREBASE_CONFIG);
    FB = firebase.firestore();
    FB.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    COLECCIONES.forEach(col => {
      FB.collection('gelato_' + col).onSnapshot(snap => {
        let cambios = 0;
        snap.docChanges().forEach(ch => {
          const d = ch.doc.data();
          if (!d || !d.id) return;
          const i = DB[col].findIndex(x => x.id === d.id);
          if (ch.type === 'removed') return;
          if (i >= 0) { DB[col][i] = d; } else { DB[col].unshift(d); }
          cambios++;
        });
        if (cambios) {
          DB[col].sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));
          localStorage.setItem(CLAVE, JSON.stringify(DB));
          if (usuario) render();
        }
      }, e => console.warn('Sin escuchar ' + col, e));
    });
    FB.collection('gelato').doc('catalogo').onSnapshot(doc => {
      const d = doc.data();
      if (!d || !d.json || d.dispositivo === ID_DISPOSITIVO) return;
      const cat = JSON.parse(d.json);
      CATALOGO.forEach(k => { if (cat[k] !== undefined) DB[k] = cat[k]; });
      localStorage.setItem(CLAVE, JSON.stringify(DB));
      if (usuario) render();
    });
    vaciarCola();
  } catch (e) { console.warn('Firebase no disponible, sigo en modo local', e); }
}
const ID_DISPOSITIVO = (() => {
  let d = localStorage.getItem('gelato_dispositivo');
  if (!d) { d = uid(); localStorage.setItem('gelato_dispositivo', d); }
  return d;
})();
function cargarScript(src) {
  return new Promise((ok, mal) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = mal;
    document.head.appendChild(s);
  });
}
async function vaciarCola() {
  if (!FB || sincronizando || !colaSync.length) return;
  sincronizando = true;
  const lote = colaSync.slice();
  try {
    for (const { col, id } of lote) {
      const obj = DB[col].find(x => x.id === id);
      if (!obj) continue;
      /* set con el mismo id: reintentar nunca duplica */
      await FB.collection('gelato_' + col).doc(id).set(obj);
      colaSync = colaSync.filter(x => !(x.col === col && x.id === id));
    }
  } catch (e) { console.warn('Quedan operaciones pendientes', e); }
  sincronizando = false;
  pintarSync();
}
let temporizadorCat = null;
function guardarCatalogo() {
  guardar();
  if (!FB) return;
  clearTimeout(temporizadorCat);
  temporizadorCat = setTimeout(() => {
    const cat = {};
    CATALOGO.forEach(k => cat[k] = DB[k]);
    FB.collection('gelato').doc('catalogo')
      .set({ json: JSON.stringify(cat), ts: Date.now(), dispositivo: ID_DISPOSITIVO })
      .catch(e => console.warn('Catálogo sin sincronizar', e));
  }, 600);
}
const hayConexionReal = () => navigator.onLine;
const puedeOperarSensible = () => !FIREBASE_CONFIG || hayConexionReal();

/* ---------- 5. AUDITORÍA ---------- */
function auditar(accion, detalle, antes, despues, motivo) {
  registrar('auditoria', {
    id: uid(), fecha: ahoraLocal(),
    usuario: usuario ? usuario.nombre : 'sistema',
    accion, detalle,
    antes: antes === undefined ? null : antes,
    despues: despues === undefined ? null : despues,
    motivo: motivo || null,
    dispositivo: ID_DISPOSITIVO
  });

const mediosActivos = () => DB.mediosPago.filter(m => m.activo);

function comisionDe(nombre, monto) {

/* ---------- 8. COSTOS ---------- */
function costoPorGramoHelado() {
  const c = DB.config;
  if (!c.costoBalde || !c.gramosBalde) return null;
  return c.costoBalde / c.gramosBalde;
}
function costoProducto(prodId) {
  const p = DB.productos.find(x => x.id === prodId);
  if (!p) return { costo: null, completo: false };
  if (p.costoManual != null && p.costoManual !== '') return { costo: +p.costoManual, completo: true };
  let total = 0, completo = true;
  if (p.gramos > 0) {
    const cg = costoPorGramoHelado();
    if (cg == null) completo = false; else total += cg * p.gramos;
  }
  DB.recetas.filter(r => r.prod === p.id).forEach(r => {
    const ins = DB.insumos.find(i => i.id === r.ins);
    if (!ins || ins.costo == null || ins.costo === '') { completo = false; return; }
    total += ins.costo * r.cant;
  });
  const tieneReceta = DB.recetas.some(r => r.prod === p.id) || p.gramos > 0;
  if (!tieneReceta) completo = false;
  return { costo: completo ? total : null, completo };
}
function margenProducto(prodId) {
  const p = DB.productos.find(x => x.id === prodId);
  const { costo } = costoProducto(prodId);
  if (costo == null || !p.precio) return null;
  return { costo, ganancia: p.precio - costo, pct: ((p.precio - costo) / p.precio) * 100 };
}

/* ---------- 9. CONSULTAS SOBRE VENTAS ---------- */
const ventasValidas = () => DB.ventas.filter(v => v.estado !== 'anulada');
function ventasDe(desde, hasta) {
  return ventasValidas().filter(v => v.fecha >= desde && v.fecha <= hasta + 'T23:59:59');
}
function ventasDelDia(d = hoy()) { return ventasValidas().filter(v => v.fecha.slice(0, 10) === d); }
function ventasDelMes(ym = mesActual()) { return ventasValidas().filter(v => v.fecha.slice(0, 7) === ym); }
const sumar = (arr, f) => arr.reduce((a, b) => a + (f ? f(b) : b), 0);
const facturacion = arr => sumar(arr, v => v.total);
const esInterno = it => it.tipo && it.tipo !== 'venta';

/* Desglose de precios: lista, bonificaciones, cortesías y descuentos */
function desglose(arr) {
  let bruto = 0, descItems = 0, descVenta = 0, cortesias = 0;
  arr.forEach(v => {
    v.items.forEach(it => {
      const lista = (it.precioLista != null ? it.precioLista : it.precio) * it.cantidad;
      if (esInterno(it)) cortesias += lista;
      else { bruto += lista; descItems += lista - it.precio * it.cantidad; }
    });
    descVenta += v.descuento ? v.descuento.monto : 0;
  });
  return { bruto, descuentos: descItems + descVenta, cortesias, neto: bruto - descItems - descVenta };
}
function cmv(arr) {
  let costo = 0, costoInterno = 0, completas = 0, parciales = 0;
  arr.forEach(v => {
    let falta = false;
    v.items.forEach(it => {
      if (it.costo == null) { falta = true; return; }
      costo += it.costo * it.cantidad;
      if (esInterno(it)) costoInterno += it.costo * it.cantidad;
    });
    falta ? parciales++ : completas++;
  });
  return { costo, costoInterno, ventasCompletas: completas, ventasParciales: parciales,
           cobertura: arr.length ? completas / arr.length : 1 };
}
function comisiones(arr) { return sumar(arr, v => sumar(v.pagos, p => p.comision || 0)); }
function porMedio(arr) {
  const m = {};
  arr.forEach(v => v.pagos.forEach(p => { m[p.medio] = (m[p.medio] || 0) + p.monto; }));
  return m;
}
function efectivoDe(arr) {
  return sumar(arr, v => sumar(v.pagos.filter(p => esEfectivo(p.medio)), p => p.monto));
}
function devolucionesDe(desde, hasta) {
  return DB.devoluciones.filter(d => d.fecha.slice(0, 10) >= desde && d.fecha.slice(0, 10) <= hasta);
}
function costoMermas(desde, hasta) {
  return sumar(DB.movStock.filter(m => m.tipo === 'merma' &&
    m.fecha.slice(0, 10) >= desde && m.fecha.slice(0, 10) <= hasta), m => m.costo || 0);
}

/* ---------- 10. INCENTIVO ---------- */
function calcularPremio(ym = mesActual()) {
  const c = DB.config;
  const vs = ventasDelMes(ym);
  const d = desglose(vs);
  const devs = sumar(DB.devoluciones.filter(x => x.fecha.slice(0, 7) === ym), x => x.monto);
  const neto = facturacion(vs) - devs;
  const base = c.baseDelPremio === 'margen' ? neto - cmv(vs).costo : neto;
  const excedente = Math.max(0, base - c.metaMensual);
  return {
    base, meta: c.metaMensual, excedente,
    premio: excedente * (c.pctPremio / 100),
    pct: c.metaMensual ? Math.min(100, (base / c.metaMensual) * 100) : 0,
    falta: Math.max(0, c.metaMensual - base),
    superada: base >= c.metaMensual
  };
}
function diasAbiertosRestantes(ym = mesActual()) {
  const total = diasDelMes(ym);
  const hoyD = new Date();
  const desde = ym === mesActual() ? hoyD.getDate() : 1;
  let n = 0;
  for (let d = desde; d <= total; d++) {
    const dow = new Date(+ym.split('-')[0], +ym.split('-')[1] - 1, d).getDay();
    if ((DB.config.diasAbiertos || [0,1,2,3,4,5,6]).includes(dow)) n++;
  }
  return n;
}
function pagosDelMes(ym = mesActual()) { return DB.pagos.filter(p => p.fecha.slice(0, 7) === ym); }
function pagoBaseDevengado(ym = mesActual()) {
  const pagados = pagosDelMes(ym).filter(p => p.tipo === 'semanal' && p.estado === 'pagado');
  return { pagado: sumar(pagados, p => p.importe), cantidad: pagados.length };
}

/* ---------- 11. RESULTADO ---------- */
function resultadoMes(ym = mesActual()) {
  const desde = ym + '-01', hasta = ym + '-' + String(diasDelMes(ym)).padStart(2, '0');
  const vs = ventasDelMes(ym);
  const d = desglose(vs);
  const c = cmv(vs);
  const com = comisiones(vs);
  const devs = sumar(DB.devoluciones.filter(x => x.fecha.slice(0, 7) === ym), x => x.monto);
  const mermas = costoMermas(desde, hasta);
  const gastosOp = sumar(DB.gastos.filter(g => g.fecha.slice(0, 7) === ym && g.tipo === 'operativo'), g => g.monto);
  const inversiones = sumar(DB.gastos.filter(g => g.fecha.slice(0, 7) === ym && g.tipo === 'inversion'), g => g.monto);
  const base = pagoBaseDevengado(ym);
  const prem = calcularPremio(ym);
  const ventasNetas = facturacion(vs) - devs;
  const margenBruto = ventasNetas - c.costo - com;
  const resultado = margenBruto - gastosOp - base.pagado - prem.premio;
  const retiros = sumar(DB.retiros.filter(r => r.fecha.slice(0, 7) === ym), r => r.monto);
  const fondoReposicion = c.costo + mermas;
  const colchon = resultado > 0 ? resultado * ((DB.config.colchonReposicion || 0) / 100) : 0;
  return {
    ym, ventasBrutas: d.bruto, descuentos: d.descuentos, cortesias: d.cortesias,
    devoluciones: devs, ventasNetas, fact: ventasNetas,
    ventas: vs.length, cmv: c.costo, costoInterno: c.costoInterno, costoMermas: mermas,
    cobertura: c.cobertura, ventasSinCosto: c.ventasParciales,
    comisiones: com, margenBruto, gastosOp, inversiones,
    pagoBase: base.pagado, pagosHechos: base.cantidad, premio: prem.premio,
    resultado, retiros, margen: ventasNetas ? (resultado / ventasNetas) * 100 : 0,
    fondoReposicion, colchon,
    disponible: Math.max(0, resultado - colchon),
    ticket: vs.length ? ventasNetas / vs.length : 0
  };
}

function marcarAgotado(tipo, id) {
  if (!puede('marcarAgotado')) return;
  const obj = tipo === 'sabor' ? DB.sabores.find(s => s.id === id) : DB.productos.find(p => p.id === id);

  const obj = tipo === 'sabor' ? DB.sabores.find(s => s.id === id) : DB.productos.find(p => p.id === id);

function tocarSabor(id, nombre) {
  if (huboLargo) { huboLargo = false; return; }

  if (i >= 0) saboresElegidos.splice(i, 1);
  else {
    if (saboresElegidos.length >= prodEnCurso.sabores) {
      if (prodEnCurso.sabores === 1) saboresElegidos = [];
      else return toast(`Máximo ${prodEnCurso.sabores} sabores`);

    b.classList.toggle('elegido', saboresElegidos.some(s => s.id === b.dataset.id)));

  if (prodEnCurso.gramos && !prodEnCurso.saboresPropios) {

  const p = prodEnCurso;
  if (DB.config.pesoReal && p.gramos >= 250 && !p.saboresPropios) return pedirPeso();
  agregarAlCarrito(p, saboresElegidos.slice());

function agregarAlCarrito(p, sabores, pesoReal) {

  const costoAjustado = (pesoReal && p.gramos && costo != null)
    ? costo + (pesoReal - p.gramos) * (costoPorGramoHelado() || 0) : costo;
  carrito.push({
    linea: uid(), prod: p.id, nombre: p.nombre,
    precioLista: p.precio, precio: p.precio, cantidad: 1,
    sabores: sabores.map(s => ({ id: s.id, nombre: s.nombre })),
    gramos, pesoReal: pesoReal || null, costo: costoAjustado,
    tipo: 'venta', motivo: null
  });

  const necesitaPin = !esAdmin() && DB.permisos.pedirPin && (pct > tope || nuevo === 0);
  const aplicar = autorizante => {

function ponerDescuento(tipo, valor) {
  if (!valor || valor <= 0) return toast('Poné un valor');
  const sub = subtotalCarrito();
  const monto = tipo === 'pct' ? Math.round(sub * valor / 100) : Math.min(valor, sub);
  const pct = sub ? (monto / sub) * 100 : 0;
  const motivo = ($('#descMotivo') && $('#descMotivo').value) || 'Promoción';
  const aplicar = autorizante => {
    descuentoVentaActual = { tipo, valor, monto, motivo,
      autorizadoPor: autorizante && autorizante !== usuario.nombre ? autorizante : null };
    cerrarHoja(); render();
    toast(`Descuento de ${plata(monto)}`);
  };
  if (!esAdmin() && DB.permisos.pedirPin && pct > (DB.permisos.maxDescuento || 0))
    pedirPin(`Descuento del ${Math.round(pct)}%`, motivo, aplicar);
  else aplicar(usuario.nombre);

function recalcularDescuento() {
  if (!descuentoVentaActual) return;

  if (descuentoVentaActual.tipo === 'pct')
    descuentoVentaActual.monto = Math.round(sub * descuentoVentaActual.valor / 100);
  else descuentoVentaActual.monto = Math.min(descuentoVentaActual.valor, sub);
}

      `<div class="dato total"><span>${resta > 0 ? 'Falta' : 'Listo'}</span>
      <b class="num">${plata(resta)}</b></div></div>` : ''}

      : `<button class="btn verde" id="btnConfirmar" onclick="confirmarVenta()">Confirmar venta</button>`}

    <button class="btn secundario" onclick="cerrarHoja()">Volver</button>
  `);

function cobrarCon(medio) {

}
function pagoParcial() {
  const total = totalCarrito();
  const pagado = sumar(pagosEnCurso, p => p.monto);
  hoja(`
    <h3>Parte del pago</h3>
    <p class="sub">Falta cobrar ${plata(total - pagado)}</p>
    <div class="campo"><label>Medio</label>
      <select id="pmedio">${mediosActivos().map(m => `<option>${esc(m.nombre)}</option>`).join('')}</select></div>
    <div class="campo"><label>Importe</label>
      <input id="pmonto" type="number" inputmode="numeric" placeholder="0"></div>
    <button class="btn" onclick="sumarPagoParcial()">Agregar</button>
    <div style="height:10px"></div>
    <button class="btn secundario" onclick="pintarCobro()">Volver</button>
  `);
  setTimeout(() => $('#pmonto') && $('#pmonto').focus(), 80);
}
function sumarPagoParcial() {
  const m = +$('#pmonto').value;
  if (!m || m <= 0) return toast('Poné un importe');
  const resta = totalCarrito() - sumar(pagosEnCurso, p => p.monto);
  pagosEnCurso.push({ medio: $('#pmedio').value, monto: Math.min(m, resta) });
  pintarCobro();
}
function quitarPago(i) { pagosEnCurso.splice(i, 1); pintarCobro(); }

const proximoNumero = () => DB.ventas.reduce((a, v) => Math.max(a, v.numero || 0), 0) + 1;

/* Una sola venta por más que se toque dos veces el botón */
function confirmarVenta() {
  if (cobrando) return;
  cobrando = true;
  const velo = $('#velo');
  if (velo) velo.classList.add('procesando');
  try {
    const total = totalCarrito();
    const pagos = pagosEnCurso.map(p => ({
      medio: p.medio, monto: p.monto, comision: comisionDe(p.medio, p.monto)
    }));
    const soloInternos = carrito.every(esInterno);
    const venta = {
      id: uid(), numero: proximoNumero(), fecha: ahoraLocal(),
      usuario: usuario.nombre, usuarioId: usuario.id,
      caja: cajaAbierta() ? cajaAbierta().id : null,
      items: carrito.map(i => ({
        prod: i.prod, nombre: i.nombre, cantidad: i.cantidad,
        precioLista: i.precioLista, precio: i.precio, costo: i.costo,
        gramos: i.gramos, pesoReal: i.pesoReal || null, sabores: i.sabores,
        tipo: i.tipo, motivo: i.motivo || null, autorizadoPor: i.autorizadoPor || null
      })),
      pagos, subtotal: subtotalCarrito(),
      descuento: descuentoVentaActual ? { ...descuentoVentaActual } : null,
      total, notas: notaVentaActual || null,
      interna: soloInternos, estado: 'confirmada',
      dispositivo: ID_DISPOSITIVO, offline: !navigator.onLine
    };
    registrar('ventas', venta);
    descontarStock(venta);
    const cambios = venta.items.filter(i => i.precio !== i.precioLista || esInterno(i));
    auditar(soloInternos ? 'Consumo interno registrado' : 'Venta registrada',

      auditar('Descuento aplicado', `#${venta.numero} · ${plata(venta.descuento.monto)}`,
        plata(venta.subtotal), plata(venta.total), venta.descuento.motivo);

    guardar();

    carrito = []; pagosEnCurso = []; catAbierta = null;

/* ---------- 19. TICKET ---------- */
function textoTicket(v) {
  const L = [];
  L.push(DB.config.negocio);
  L.push(`Operación #${v.numero} · ${fechaCorta(v.fecha)} ${hora(v.fecha)}`);
  L.push('');
  v.items.forEach(i => {
    L.push(`${i.cantidad > 1 ? i.cantidad + 'x ' : ''}${i.nombre}${esInterno(i) ? ' (' + etiquetaTipo(i.tipo) + ')' : ''}  ${plata(i.precio * i.cantidad)}`);
    if (i.sabores.length) L.push(`   ${i.sabores.map(s => s.nombre).join(', ')}`);
  });
  if (v.descuento) L.push(`Descuento (${v.descuento.motivo})  -${plata(v.descuento.monto)}`);
  L.push('');
  L.push(`TOTAL  ${plata(v.total)}`);
  if (v.pagos.length) L.push(v.pagos.map(p => `${p.medio}: ${plata(p.monto)}`).join(' · '));
  if (v.notas) L.push(`Nota: ${v.notas}`);
  L.push('');
  L.push('Comprobante interno. No válido como factura.');
  return L.join('\n');
}

/* ---------- 20. STOCK POR VENTA ---------- */
function descontarStock(venta, signo = -1) {
  venta.items.forEach(it => {
    const p = DB.productos.find(x => x.id === it.prod);
    if (it.gramos > 0 && it.sabores.length && (!p || !p.saboresPropios)) {
      const porSabor = (it.gramos * it.cantidad) / it.sabores.length;
      it.sabores.forEach(s => {
        const sb = DB.sabores.find(x => x.id === s.id);
        if (!sb) return;
        sb.stock = (sb.stock || 0) + signo * porSabor;
        if (sb.stock <= 0 && signo < 0) { sb.agotado = true; sb.forzarDisponible = false; }
        if (sb.stock > 0 && signo > 0) sb.agotado = false;
        registrar('movStock', {
          id: uid(), fecha: ahoraLocal(), tipo: signo < 0 ? 'venta' : 'devolución',
          sabor: sb.id, nombre: sb.nombre, cantidad: signo * porSabor,
          unidad: 'g', ref: venta.numero, usuario: usuario ? usuario.nombre : '—'
        });
      });
    }
    if (p) DB.recetas.filter(r => r.prod === p.id).forEach(r => {
      const ins = DB.insumos.find(i => i.id === r.ins);
      if (ins) ins.stock = (ins.stock || 0) + signo * r.cant * it.cantidad;
    });
  });
  guardarCatalogo();
}

/* ---------- 22. CAJA ---------- */
function cajaAbierta() { return DB.cajas.find(c => c.estado === 'abierta'); }

function resumenCaja(c) {
  const vs = ventasValidas().filter(v => v.caja === c.id);
  const movs = DB.movCaja.filter(m => m.caja === c.id);
  const devs = DB.devoluciones.filter(d => d.caja === c.id && esEfectivo(d.medio));
  const ef = efectivoDe(vs);
  const ing = sumar(movs.filter(m => m.tipo === 'ingreso' || m.tipo === 'fondo'), m => m.monto);
  const egr = sumar(movs.filter(m => m.tipo === 'egreso'), m => m.monto);
  const ret = sumar(movs.filter(m => m.tipo === 'retiro'), m => m.monto);
  const dev = sumar(devs, d => d.monto);
  return {
    vs, movs, ef, ing, egr, ret, dev,
    esperado: c.efectivoInicial + ef + ing - egr - ret - dev,
    electronico: facturacion(vs) - ef
  };
}

/* ---------- 23. ARQUEO Y CIERRE DEL DÍA ---------- */
let conteo = {};
function pedirCierreCaja() {
  const c = cajaAbierta();
  const r = resumenCaja(c);
  conteo = {};
  hoja(`
    <h3>Cerrar la caja</h3>
    <p class="sub">Contá el efectivo que tenés. El total esperado se muestra recién después,
      para que el conteo sea real.</p>
    ${DB.config.conteoBilletes ? `
      <div class="tit-seccion" style="margin-top:0">Contar billetes</div>
      <div id="billetes">${DB.config.denominaciones.map(d => `
        <div class="billetes">
          <span class="den">${plata(d)}</span>
          <input type="number" inputmode="numeric" min="0" placeholder="0"
            onchange="contarBillete(${d}, this.value)" oninput="contarBillete(${d}, this.value)">
          <span class="sub" id="sub${d}">—</span>
        </div>`).join('')}</div>
      <div class="dato total"><span>Contado</span><b class="num" id="totalContado">$0</b></div>
      <div style="height:14px"></div>` : ''}
    <div class="campo"><label>Efectivo contado</label>
      <input id="efReal" type="number" inputmode="numeric" placeholder="0" oninput="previaDiferencia(${r.esperado})"></div>
    <div id="previaDif"></div>
    <div class="campo"><label>Observaciones</label><input id="obsCierre" placeholder="Opcional"></div>
    <button class="btn" onclick="cerrarCaja(${r.esperado})">Cerrar el día</button>
    <div style="height:10px"></div><button class="btn secundario" onclick="cerrarHoja()">Volver</button>
  `);
}
function contarBillete(den, cant) {
  conteo[den] = +cant || 0;
  const sub = den * conteo[den];
  const e = $('#sub' + den); if (e) e.textContent = sub ? plata(sub) : '—';
  const total = Object.entries(conteo).reduce((a, [d, n]) => a + d * n, 0);
  const t = $('#totalContado'); if (t) t.textContent = plata(total);
  const campo = $('#efReal');
  if (campo && total) { campo.value = total; campo.dispatchEvent(new Event('input')); }
}
function previaDiferencia(esperado) {
  const real = +$('#efReal').value;
  const d = real - esperado;
  if (!$('#efReal').value) return $('#previaDif').innerHTML = '';
  const clase = Math.abs(d) < 1 ? 'info' : Math.abs(d) <= esperado * 0.01 ? 'alerta' : 'error';
  $('#previaDif').innerHTML = `<div class="aviso ${clase}"><span>${Math.abs(d) < 1 ? '✓' : '⚠️'}</span>
    <div>${Math.abs(d) < 1 ? 'La caja cuadra exacto.' :
      `${d > 0 ? 'Sobran' : 'Faltan'} ${plata(Math.abs(d))} respecto de lo esperado.`}</div></div>`;
}
function cerrarCaja(esperado) {
  const real = +$('#efReal').value;
  if (!$('#efReal').value) return toast('Contá el efectivo primero');
  const c = cajaAbierta();
  c.estado = 'cerrada'; c.cerrada = ahoraLocal(); c.cerradaPor = usuario.nombre;
  c.efectivoEsperado = esperado; c.efectivoDeclarado = real; c.diferencia = real - esperado;
  c.observaciones = $('#obsCierre').value.trim();
  c.conteo = Object.keys(conteo).length ? conteo : null;
  actualizar('cajas', c);
  auditar('Caja cerrada', `Esperado ${plata(esperado)} · contado ${plata(real)} · diferencia ${plata(c.diferencia)}`,
    plata(esperado), plata(real), c.observaciones || null);
  guardar(); cerrarHoja(); render();
  mostrarCierreDia(c);
}
function mostrarCierreDia(c) {

      <div class="dato"><span>Ticket promedio</span><b class="num">${plata(r.vs.length ? facturacion(r.vs) / r.vs.length : 0)}</b></div>

      ${d.cortesias ? `<div class="dato"><span>Cortesías y consumos</span><b class="num">${plata(d.cortesias)}</b></div>` : ''}

      ${r.dev ? `<div class="dato"><span>Devoluciones</span><b class="num">${plata(r.dev)}</b></div>` : ''}

function compartirCierre(id) {

/* ---------- 25. STOCK ---------- */
function estadoStock(actual, minimo) {
  if (actual <= 0) return { clase: 'mal', txt: 'Sin stock', em: '🔴' };
  if (actual <= minimo) return { clase: 'mal', txt: 'Reponer urgente', em: '🔴' };
  if (actual <= minimo * 1.8) return { clase: 'medio', txt: 'Reponer pronto', em: '🟡' };
  return { clase: 'ok', txt: 'Stock ok', em: '🟢' };
}
/* En modo simple se habla de baldes; en detallado, de gramos */
function mostrarHelado(gramos) {
  const b = gramos / DB.config.gramosBalde;
  if (DB.config.modoStock === 'simple') return (Math.max(0, b)).toFixed(1) + ' baldes';
  return Math.max(0, Math.round(gramos)).toLocaleString('es-AR') + ' g';
}
function faltantes() {
  const sab = DB.sabores.filter(s => s.activo && (s.stock <= s.minimo * 1.8 || s.agotado))
    .map(s => ({ nombre: s.nombre, detalle: mostrarHelado(s.stock), urgente: s.stock <= s.minimo || s.agotado }));
  const ins = DB.insumos.filter(i => i.stock <= i.minimo * 1.8)
    .map(i => ({ nombre: i.nombre, detalle: Math.round(i.stock) + ' ' + (i.unidad === 'unidad' ? 'u' : i.unidad),
                 urgente: i.stock <= i.minimo }));
  return [...sab, ...ins];
}
function vistaStock() {
  const sabs = saboresParaVender();
  const f = faltantes();
  let h = '';
  if (f.length) {
    h += `<div class="aviso ${f.some(x => x.urgente) ? 'alerta' : 'info'}"><span>🛒</span><div>
      <b>Hay que pedir:</b> ${f.map(x => esc(x.nombre)).join(', ')}.
      <button class="btn chico secundario" style="margin-top:8px" onclick="listaReposicion()">Armar lista</button></div></div>`;
  }
  h += `<div class="tit-seccion">Helado por sabor</div><div class="tarjeta">`;
  h += sabs.map(s => {
    const e = s.agotado ? { clase: 'mal', em: '🔴' } : estadoStock(s.stock, s.minimo);
    const bochas = Math.floor(Math.max(0, s.stock) / DB.config.gramosBocha);
    const pct = Math.max(0, Math.min(100, (s.stock / (DB.config.gramosBalde * 1.2)) * 100));
    return `<div class="linea-stock" ${esAdmin() ? `onclick="ajustarSabor('${s.id}')" style="cursor:pointer"` : ''}>
      <span class="bocha grande" style="background:${s.color}"></span>
      <div class="ls-nom">${esc(s.nombre)}
        ${s.agotado ? '<span class="et cortesia">agotado</span>' : ''}
        ${s.forzarDisponible ? '<span class="et desc">habilitado a mano</span>' : ''}
        <div class="barrita"><i style="width:${pct}%;background:${e.clase === 'mal' ? 'var(--frambuesa)' : e.clase === 'medio' ? 'var(--dulce)' : 'var(--pistacho)'}"></i></div>
      </div>
      <div style="text-align:right">
        <div class="ls-can">${mostrarHelado(s.stock)}</div>
        <div style="font-size:12px;color:var(--cacao-suave)">${bochas} bochas ${e.em}</div>
      </div></div>`;
  }).join('') + `</div>`;

  h += `<div class="tit-seccion">Insumos</div><div class="tarjeta">`;
  h += DB.insumos.map(i => {
    const e = estadoStock(i.stock, i.minimo);
    return `<div class="linea-stock" ${esAdmin() ? `onclick="ajustarInsumo('${i.id}')" style="cursor:pointer"` : ''}>
      <div class="ls-nom">${esc(i.nombre)}</div>
      <div style="text-align:right">
        <div class="ls-can">${Math.round(i.stock).toLocaleString('es-AR')} ${i.unidad === 'unidad' ? 'u' : i.unidad}</div>
        <span class="pildora ${e.clase}">${e.txt}</span>
      </div></div>`;
  }).join('') + `</div>`;

  if (esAdmin()) {
    h += `<div style="height:6px"></div>
      <div class="fila-btn">
        <button class="btn" onclick="entradaMercaderia()">Entró mercadería</button>
        <button class="btn secundario" onclick="registrarMerma()">Merma</button>
      </div>
      <div class="fila-btn">
        <button class="btn secundario" onclick="hacerInventario()">Hacer inventario</button>
        <button class="btn secundario" onclick="verMovStock()">Movimientos</button>
      </div>`;
  } else {
    h += `<div class="fila-btn">
      <button class="btn secundario" onclick="listaReposicion()">Armar lista de pedido</button>
      ${puede('marcarAgotado') ? `<button class="btn secundario" onclick="marcarAgotadoRapido()">Marcar agotado</button>` : ''}
    </div>`;
  }
  return h;
}

function sumarEntrada(id) {
  const e = entrada.find(x => x.sabor === id);
  if (e) e.cantidad++; else entrada.push({ sabor: id, cantidad: 1 });
  pintarEntrada();

function quitarEntrada(i) { entrada.splice(i, 1); pintarEntrada(); }
function nuevoSaborRapido() {
  hoja(`<h3>Gusto nuevo</h3>
    <p class="sub">Se agrega al catálogo y queda disponible para vender.</p>
    <div class="campo"><label>Nombre</label><input id="nsNombre" placeholder="Tramontana"></div>

function crearSaborRapido() {
  const nombre = $('#nsNombre').value.trim();
  if (!nombre) return toast('Poné el nombre');
  const s = { id: uid(), nombre, color: $('#nsColor').value, activo: true,
    orden: DB.sabores.length + 1, agotado: true, forzarDisponible: false, stock: 0, minimo: 1500 };
  DB.sabores.push(s);
  auditar('Sabor creado', nombre);
  guardarCatalogo();
  entrada.push({ sabor: s.id, cantidad: 1 });
  pintarEntrada();
  toast(nombre + ' agregado');
}
function guardarEntrada() {
  if (!entrada.length) return toast('Marcá qué gustos llegaron');
  const total = sumar(entrada, e => e.cantidad);
  const importe = +$('#enTotal').value || Math.round(total * DB.config.costoBalde);
  const provId = $('#enProv').value;
  const prov = DB.proveedores.find(p => p.id === provId);

function sumarBalde(id, n) {
  const s = DB.sabores.find(x => x.id === id);
  const g = DB.config.gramosBalde * n;
  s.stock += g; s.agotado = false;
  registrar('movStock', { id: uid(), fecha: ahoraLocal(), tipo: 'entrada', sabor: s.id,
    nombre: s.nombre, cantidad: g, unidad: 'g', costo: DB.config.costoBalde * n, usuario: usuario.nombre });
  auditar('Entrada de helado', `${s.nombre} +${n} balde(s)`);

function guardarAjusteSabor(id) {
  const s = DB.sabores.find(x => x.id === id);
  const val = +$('#stkNuevo').value;
  const nuevo = DB.config.modoStock === 'simple' ? val * DB.config.gramosBalde : val;
  const motivo = $('#stkMotivo').value;
  const dif = nuevo - s.stock;
  const guardarlo = autorizante => {
    auditar('Ajuste de stock', `${s.nombre}: ${mostrarHelado(s.stock)} → ${mostrarHelado(nuevo)}`,
      Math.round(s.stock), Math.round(nuevo), motivo);
    if (dif !== 0) registrar('movStock', { id: uid(), fecha: ahoraLocal(), tipo: 'ajuste',
      sabor: s.id, nombre: s.nombre, cantidad: dif, unidad: 'g', motivo,
      costo: dif < 0 ? Math.abs(dif) * (costoPorGramoHelado() || 0) : 0,
      usuario: usuario.nombre, autorizadoPor: autorizante });
    s.stock = nuevo; s.minimo = +$('#stkMin').value;
    if (s.stock > 0) s.agotado = false;
    guardarCatalogo(); cerrarHoja(); render(); toast('Stock ajustado');
  };
  if (!esAdmin()) pedirPin('Ajuste de stock', s.nombre, guardarlo);
  else guardarlo(usuario.nombre);
}

function guardarMerma() {
  const [tipo, id] = $('#mrQue').value.split(':');
  const cant = +$('#mrCant').value, motivo = $('#mrMotivo').value;
  if (!cant || cant <= 0) return toast('Poné la cantidad');
  const obj = tipo === 'sb' ? DB.sabores.find(s => s.id === id) : DB.insumos.find(i => i.id === id);
  obj.stock -= cant;
  if (tipo === 'sb' && obj.stock <= 0) obj.agotado = true;
  const costo = tipo === 'sb' ? cant * (costoPorGramoHelado() || 0) : cant * (obj.costo || 0);
  registrar('movStock', { id: uid(), fecha: ahoraLocal(), tipo: 'merma',
    [tipo === 'sb' ? 'sabor' : 'insumo']: id, nombre: obj.nombre, cantidad: -cant,
    unidad: tipo === 'sb' ? 'g' : obj.unidad, motivo, costo, usuario: usuario.nombre });
  auditar('Merma', `${obj.nombre} −${cant} · costo ${plata(costo)}`, null, null, motivo);
  guardarCatalogo(); cerrarHoja(); render(); toast('Merma registrada');
}

function guardarInventario() {
  const motivo = $('#invMotivo').value;
  const lineas = [];
  Object.entries(inventario).forEach(([id, val]) => {
    if (val === '' || val === null) return;
    const s = DB.sabores.find(x => x.id === id);
    const nuevo = +val * DB.config.gramosBalde;
    const dif = nuevo - s.stock;
    if (Math.abs(dif) < 1) return;
    lineas.push({ sabor: s.nombre, antes: Math.round(s.stock), despues: Math.round(nuevo), dif: Math.round(dif) });
    registrar('movStock', { id: uid(), fecha: ahoraLocal(), tipo: 'ajuste', sabor: s.id,
      nombre: s.nombre, cantidad: dif, unidad: 'g', motivo,
      costo: dif < 0 ? Math.abs(dif) * (costoPorGramoHelado() || 0) : 0, usuario: usuario.nombre });
    s.stock = nuevo;
    if (s.stock > 0) s.agotado = false;
  });
  if (!lineas.length) { cerrarHoja(); return toast('No hubo diferencias'); }
  registrar('inventarios', { id: uid(), fecha: ahoraLocal(), usuario: usuario.nombre, motivo, lineas });
  auditar('Inventario', `${lineas.length} sabores ajustados`, null, null, motivo);
  guardarCatalogo(); cerrarHoja(); render();
  toast(`Inventario guardado · ${lineas.length} ajustes`);
}

function rankingProductos(vs) {
  const m = {};
  vs.forEach(v => v.items.forEach(i => {
    m[i.nombre] = m[i.nombre] || { nombre: i.nombre, cant: 0, monto: 0 };
    m[i.nombre].cant += i.cantidad; m[i.nombre].monto += i.precio * i.cantidad;
  }));
  return Object.values(m).sort((a, b) => b.cant - a.cant);
}
function rankingSabores(vs) {
  const m = {};
  vs.forEach(v => v.items.forEach(i => {
    if (!i.gramos || !i.sabores.length) return;
    const porSabor = (i.gramos * i.cantidad) / i.sabores.length;
    i.sabores.forEach(s => {
      const sb = DB.sabores.find(x => x.id === s.id);
      if (!sb) return;
      m[sb.id] = m[sb.id] || { nombre: sb.nombre, color: sb.color, gramos: 0, veces: 0 };
      m[sb.id].gramos += porSabor; m[sb.id].veces++;
    });
  }));
  return Object.values(m).sort((a, b) => b.gramos - a.gramos);
}
function ventasPorHora(vs) {
  const out = [];
  for (let h = 9; h <= 23; h++) out.push({ h, monto: 0 });
  vs.forEach(v => {
    const h = new Date(v.fecha).getHours();
    const f = out.find(x => x.h === h);
    if (f) f.monto += v.total;
  });
  return out;
}
function mejorDia(vs) {
  const m = {};
  vs.forEach(v => { const d = v.fecha.slice(0, 10); m[d] = (m[d] || 0) + v.total; });
  const e = Object.entries(m).sort((a, b) => b[1] - a[1])[0];
  return e ? `${fechaCorta(e[0])} · ${plataCorta(e[1])}` : '—';
}

  const cant = +$('#cpCant').value, total = +$('#cpTotal').value;

    detalle = `${cant} balde(s) de ${s.nombre}`;
    registrar('movStock', { id: uid(), fecha: ahoraLocal(), tipo: 'entrada', sabor: s.id,

    detalle = `${cant} ${i.unidad} de ${i.nombre}`;
    registrar('movStock', { id: uid(), fecha: ahoraLocal(), tipo: 'entrada', insumo: i.id,
      nombre: i.nombre, cantidad: cant, unidad: i.unidad, costo: total, usuario: usuario.nombre });

let rangoRep = 'mes', rangoD1 = '', rangoD2 = '';
function rangoFechas(r) {
  const d = new Date(), hoyS = hoy();
  if (r === 'hoy') return [hoyS, hoyS];
  if (r === 'ayer') { const a = fechaLocal(new Date(d - 86400000)); return [a, a]; }
  if (r === 'semana') return [fechaLocal(new Date(d - 6 * 86400000)), hoyS];
  if (r === 'mes') return [mesActual() + '-01', hoyS];
  if (r === 'mesant') {
    const ym = fechaLocal(new Date(d.getFullYear(), d.getMonth() - 1, 1)).slice(0, 7);
    return [ym + '-01', ym + '-' + String(diasDelMes(ym)).padStart(2, '0')];
  }
  if (r === 'custom' && rangoD1 && rangoD2) return [rangoD1, rangoD2];
  return [mesActual() + '-01', hoyS];
}

function bajarArchivo(nombre, contenido, tipo = 'text/csv;charset=utf-8') {
  const blob = new Blob(['\ufeff' + contenido], { type: tipo });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  a.click(); URL.revokeObjectURL(a.href);
}
const aCSV = filas => filas.map(f => f.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
function exportarVentas(d1, d2) {
  const vs = DB.ventas.filter(v => v.fecha.slice(0, 10) >= d1 && v.fecha.slice(0, 10) <= d2);
  const filas = [['Operacion','Fecha','Hora','Usuario','Producto','Cantidad','Sabores','Tipo',
    'PrecioLista','PrecioCobrado','Diferencia','Motivo','Costo','DescuentoVenta','MediosPago','TotalOperacion','Estado','Nota']];
  vs.forEach(v => v.items.forEach(i => filas.push([
    v.numero, v.fecha.slice(0, 10), hora(v.fecha), v.usuario, i.nombre, i.cantidad,
    i.sabores.map(s => s.nombre).join(' / '), i.tipo || 'venta',
    i.precioLista, i.precio, (i.precioLista - i.precio) * i.cantidad, i.motivo || '',
    i.costo ?? '', v.descuento ? v.descuento.monto : 0,
    v.pagos.map(p => p.medio + ' ' + p.monto).join(' + '), v.total, v.estado, v.notas || ''
  ])));
  bajarArchivo(`ventas_${d1}_a_${d2}.csv`, aCSV(filas));
  toast('Archivo descargado');
}
function exportarTabla(tabla, d1, d2) {
  const enRango = f => f && f.slice(0, 10) >= d1 && f.slice(0, 10) <= d2;
  let filas = [], nombre = tabla;
  if (tabla === 'caja') {
    filas = [['Fecha','Abrio','Cerro','EfectivoInicial','Esperado','Contado','Diferencia','Observaciones']];
    DB.cajas.filter(c => enRango(c.fecha)).forEach(c => filas.push([c.fecha, c.abiertaPor, c.cerradaPor || '',
      c.efectivoInicial, c.efectivoEsperado ?? '', c.efectivoDeclarado ?? '', c.diferencia ?? '', c.observaciones || '']));
  } else if (tabla === 'stock') {
    filas = [['Fecha','Tipo','Item','Cantidad','Unidad','Motivo','Costo','Usuario']];
    DB.movStock.filter(m => enRango(m.fecha)).forEach(m => filas.push([m.fecha.slice(0, 10), m.tipo,
      m.nombre, Math.round(m.cantidad), m.unidad, m.motivo || '', Math.round(m.costo || 0), m.usuario]));
  } else if (tabla === 'compras') {
    filas = [['Fecha','Proveedor','Detalle','Cantidad','CostoUnitario','Total','Medio','Estado','Comprobante','Vencimiento']];
    DB.compras.filter(c => enRango(c.fecha)).forEach(c => filas.push([c.fecha, c.proveedor, c.detalle,
      c.cantidad || '', Math.round(c.costoUnitario || 0), c.total, c.medio || '', c.estado, c.comprobante || '', c.vencimiento || '']));
  } else if (tabla === 'gastos') {
    filas = [['Fecha','Tipo','Categoria','Detalle','Monto','Medio','Usuario']];
    DB.gastos.filter(g => enRango(g.fecha)).forEach(g => filas.push([g.fecha, g.tipo, g.categoria,
      g.descripcion || '', g.monto, g.medio || '', g.usuario || '']));
  } else if (tabla === 'pagos') {
    filas = [['Fecha','Tipo','Importe','Medio','Estado','Nota']];
    DB.pagos.filter(p => enRango(p.fecha)).forEach(p => filas.push([p.fecha, p.tipo, p.importe, p.medio, p.estado, p.nota || '']));
    filas.push([]); filas.push(['RETIROS DE SOCIOS']);
    filas.push(['Fecha','Socio','Monto','Medio','Motivo']);
    DB.retiros.filter(r => enRango(r.fecha)).forEach(r => filas.push([r.fecha, r.socio, r.monto, r.medio, r.motivo || '']));
  } else {
    filas = [['Fecha','Hora','Usuario','Accion','Detalle','Antes','Despues','Motivo']];
    DB.auditoria.filter(a => enRango(a.fecha)).forEach(a => filas.push([a.fecha.slice(0, 10), hora(a.fecha),
      a.usuario, a.accion, a.detalle || '', JSON.stringify(a.antes ?? ''), JSON.stringify(a.despues ?? ''), a.motivo || '']));
  }
  bajarArchivo(`${nombre}_${d1}_a_${d2}.csv`, aCSV(filas));
  toast('Archivo descargado');
}
function exportarResumen(d1, d2) {
  const vs = ventasDe(d1, d2), c = cmv(vs), dg = desglose(vs);
  const devs = sumar(devolucionesDe(d1, d2), x => x.monto);
  const filas = [['Concepto','Importe'],
    ['Ventas brutas', Math.round(dg.bruto)],
    ['Descuentos', Math.round(dg.descuentos)],
    ['Devoluciones', Math.round(devs)],
    ['Ventas netas', Math.round(facturacion(vs) - devs)],
    ['Cortesías y consumos internos', Math.round(dg.cortesias)],
    ['Operaciones', vs.length],
    ['Ticket promedio', vs.length ? Math.round(facturacion(vs) / vs.length) : 0],
    ['Costo de lo vendido', Math.round(c.costo)],
    ['Comisiones', Math.round(comisiones(vs))],
    ['Margen bruto', Math.round(facturacion(vs) - devs - c.costo - comisiones(vs))],
    ['Costo de mermas', Math.round(costoMermas(d1, d2))],
    ['Gastos operativos', sumar(DB.gastos.filter(g => g.fecha >= d1 && g.fecha <= d2 && g.tipo === 'operativo'), g => g.monto)],
    ['Compras', sumar(DB.compras.filter(x => x.fecha >= d1 && x.fecha <= d2), x => x.total)],
    [], ['Medio de pago','Importe'], ...Object.entries(porMedio(vs)),
    [], ['Producto','Unidades','Facturado'], ...rankingProductos(vs).map(p => [p.nombre, p.cant, Math.round(p.monto)]),
    [], ['Sabor','Veces','Gramos'], ...rankingSabores(vs).map(s => [s.nombre, s.veces, Math.round(s.gramos)])
  ];
  bajarArchivo(`resumen_${d1}_a_${d2}.csv`, aCSV(filas));
  toast('Archivo descargado');
}

/* ---------- 37. CIERRE DE MES ---------- */
function plataCierre() {
  const ym = mesActual();
  const cerrado = DB.cierres.find(c => c.ym === ym);
  const r = resultadoMes(ym);
  let h = '';
  if (cerrado) {
    h += `<div class="aviso info"><span>🔒</span><div>${nombreMes(ym)} está cerrado desde el
      ${fechaCorta(cerrado.fecha)} por ${esc(cerrado.usuario)}.</div></div>
      <button class="btn peligro" onclick="reabrirMes('${ym}')">Reabrir el mes</button>`;
  } else {
    h += tarjetaResultado(r);
    h += `<div class="tarjeta">${DB.socios.map(s => `<div class="dato"><span>${esc(s.nombre)} (${s.pct}%)</span>
      <b class="num">${plata(r.disponible * s.pct / 100)}</b></div>`).join('')}</div>`;
    if (r.ventasSinCosto) h += `<div class="aviso alerta"><span>⚠️</span><div>
      Hay ${r.ventasSinCosto} operaciones con productos sin costo. El resultado es parcial.</div></div>`;
    const pend = DB.compras.filter(c => c.estado === 'pendiente');
    if (pend.length) h += `<div class="aviso alerta"><span>🧾</span><div>
      Quedan ${pend.length} compras sin pagar por ${plata(sumar(pend, c => c.total))}.</div></div>`;
    h += `<button class="btn" onclick="cerrarMes('${ym}')">Cerrar ${nombreMes(ym)}</button>`;
  }
  h += `<div class="tit-seccion">Meses cerrados</div>`;
  h += DB.cierres.length ? `<div class="lista-mov">${DB.cierres.map(c => `<button class="mov" onclick="verCierre('${c.ym}')">
    <div class="mv-i"><div class="mv-t">${nombreMes(c.ym)}</div>
    <div class="mv-s">Netas ${plataCorta(c.ventasNetas || c.fact)} · ${c.ventas} operaciones</div></div>
    <div class="mv-m num">${plataCorta(c.resultado)}</div></button>`).join('')}</div>`
    : `<div class="vacio"><p>Sin meses cerrados todavía</p></div>`;
  return h;
}
function cerrarMes(ym) {
  if (!puedeOperarSensible()) return toast('Necesitás conexión para cerrar el mes');
  const r = resultadoMes(ym);
  confirmar(`Cerrar ${nombreMes(ym)}`,
    `Se guarda una foto de los números: ventas netas ${plata(r.ventasNetas)}, resultado ${plata(r.resultado)}. Después nadie puede modificar el mes sin reabrirlo, y queda registrado.`,
    'Confirmar cierre', () => confirmarCierreMes(ym), false);
}
function confirmarCierreMes(ym) {
  const r = resultadoMes(ym);
  registrar('cierres', { ...r, id: uid(), ym, fecha: ahoraLocal(), usuario: usuario.nombre,
    socios: DB.socios.map(s => ({ nombre: s.nombre, pct: s.pct, monto: r.disponible * s.pct / 100 })) });
  auditar('Cierre de mes', `${nombreMes(ym)} · resultado ${plata(r.resultado)}`);
  guardar(); render(); toast(`${nombreMes(ym)} cerrado`);

function guardarProducto(id) {
  const nombre = $('#pdNombre').value.trim();
  const precio = +$('#pdPrecio').value;
  if (!nombre || !precio) return toast('Falta nombre o precio');
  const datos = { nombre, emoji: $('#pdEmoji').value.trim(), cat: $('#pdCat').value, precio,
    gramos: +$('#pdGramos').value || 0, sabores: +$('#pdSabores').value || 0,
    costoManual: $('#pdCosto').value === '' ? null : +$('#pdCosto').value };
  if (id) {
    const p = DB.productos.find(x => x.id === id);

function cambiarProveedor(i, v) {

function guardarUsuario(id) {
  const nombre = $('#usNombre').value.trim(), pin = $('#usPin').value.trim();

    const u = DB.usuarios.find(x => x.id === id);
    u.nombre = nombre; u.rol = $('#usRol').value; u.pin = pin;

  } else {
    DB.usuarios.push({ id: uid(), nombre, rol: $('#usRol').value, pin, activo: true });

function descargarBackup() {

  auditar('Backup descargado', hoy());

}
function exportarTodo() {
  const d1 = '2000-01-01', d2 = '2099-12-31';
  ['caja','stock','compras','gastos','pagos','auditoria'].forEach((t, i) =>
    setTimeout(() => exportarTabla(t, d1, d2), i * 350));

  toast('Descargando todas las tablas');
}
function pedirRestaurar() {
  hoja(`<h3>Restaurar una copia</h3>
    <p class="sub">Reemplaza todos los datos actuales por los del archivo. No se puede deshacer.</p>
    <div class="campo"><label>Archivo .json</label><input id="bkFile" type="file" accept="application/json"></div>
    <button class="btn peligro" onclick="restaurarBackup()">Restaurar</button>
    <div style="height:10px"></div><button class="btn secundario" onclick="cerrarHoja()">Cancelar</button>`);
}
function restaurarBackup() {
  const f = $('#bkFile').files[0];
  if (!f) return toast('Elegí el archivo');
  const lector = new FileReader();
  lector.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!d.ventas || !d.config) throw new Error('formato');
      DB = d; migrar(); guardar(); cerrarHoja(); pintarLogin(); render();
      toast('Copia restaurada');
    } catch (err) { toast('El archivo no es una copia válida'); }
  };
  lector.readAsText(f);
}

  hoja(`<h3>Reiniciar con la carga inicial</h3>

function segundaConfirmacionReinicio() {

async function reiniciarCarga() {
  const quien = usuario ? usuario.nombre : 'sistema';
  /* primero la nube, si no vuelve a bajar lo viejo en el próximo arranque */
  if (FB) {
    for (const col of COLECCIONES) {
      for (const x of DB[col]) {
        try { await FB.collection('gelato_' + col).doc(x.id).delete(); } catch (e) {}
      }
    }
  }
  colaSync = [];
  localStorage.removeItem(CLAVE);
  DB = datosIniciales();
  usuario = DB.usuarios.find(u => u.id === (usuario ? usuario.id : 'u1')) || DB.usuarios[0];
  auditar('Sistema reiniciado', 'Vuelta a la carga inicial', null, null, 'Reiniciado por ' + quien);
  guardar();
  guardarCatalogo();          /* deja el catálogo nuevo también en la nube */
  cerrarHoja(); pintarLogin(); render();
  toast('Listo. Los 11 gustos y los envases están cargados de nuevo.');
}

  COLECCIONES.filter(c => c !== 'auditoria').forEach(c => {

/* ---------- 39. DATOS DE DEMOSTRACIÓN ---------- */
function sembrarDemo() {
  const prods = DB.productos;
  const sabs = DB.sabores;
  const pesos = { p1: 18, p2: 30, p3: 12, p4: 7, p5: 4, p6: 20, p7: 9 };
  const bolsa = [];
  Object.entries(pesos).forEach(([id, n]) => { for (let i = 0; i < n; i++) bolsa.push(id); });
  const medios = ['Efectivo','Efectivo','Efectivo','Mercado Pago / QR','Mercado Pago / QR','Débito','Crédito','Transferencia'];
  const azar = a => a[Math.floor(Math.random() * a.length)];

  const hoyD = new Date();
  const desde = new Date(hoyD.getFullYear(), hoyD.getMonth() - 1, 1);
  const ventas = [];
  for (let d = new Date(desde); d <= hoyD; d.setDate(d.getDate() + 1)) {
    const finde = d.getDay() === 0 || d.getDay() === 6;
    const cant = Math.round((finde ? 46 : 27) * (0.75 + Math.random() * 0.5));
    for (let i = 0; i < cant; i++) {
      const h = azar([13,14,15,16,17,17,18,18,19,19,20,20,21,21,22,16,19,20]);
      const f = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, Math.floor(Math.random() * 60));
      if (f > hoyD) continue;
      const items = [];
      const n = Math.random() < 0.28 ? 2 : 1;
      for (let k = 0; k < n; k++) {
        const idProd = azar(bolsa);
        const p = prods.find(x => x.id === idProd);
        const sabores = [];
        if (p.sabores > 0) {
          if (p.saboresPropios) sabores.push({ id: 'ms0', nombre: azar(p.saboresPropios) });
          else {
            const cuantos = Math.min(p.sabores, 1 + Math.floor(Math.random() * p.sabores));
            const copia = sabs.slice();
            for (let j = 0; j < cuantos; j++) {
              const s = copia.splice(Math.floor(Math.random() * copia.length), 1)[0];
              if (s) sabores.push({ id: s.id, nombre: s.nombre });
            }
          }
        }
        const { costo } = costoProducto(p.id);
        /* alguna cortesía y algún precio editado, como en la vida real */
        const suerte = Math.random();
        let tipo = 'venta', precio = p.precio, motivo = null;
        if (suerte < 0.012) { tipo = 'cortesia'; precio = 0; motivo = 'Invitación de la casa'; }
        else if (suerte < 0.02) { tipo = 'consumo_personal'; precio = 0; motivo = 'Consumo del personal'; }
        else if (suerte < 0.035) { precio = Math.round(p.precio * 0.9 / 100) * 100; motivo = 'Cliente habitual'; }
        items.push({ prod: p.id, nombre: p.nombre, cantidad: 1, precioLista: p.precio, precio,
          costo, gramos: p.gramos, pesoReal: null, sabores, tipo, motivo });
      }
      const total = sumar(items, i2 => i2.precio * i2.cantidad);
      const medio = azar(medios);
      ventas.push({
        id: uid(), numero: 0, fecha: ahoraLocal(f),
        usuario: 'Encargada', usuarioId: 'u2', caja: null,
        items, subtotal: total, descuento: null, total,
        interna: total === 0, estado: 'confirmada', notas: null,
        pagos: total > 0 ? [{ medio, monto: total, comision: comisionDe(medio, total) }] : [],
        dispositivo: ID_DISPOSITIVO
      });
    }
  }
  ventas.sort((a, b) => b.fecha.localeCompare(a.fecha));
  ventas.forEach((v, i) => v.numero = ventas.length - i);
  DB.ventas = ventas;

  const mesAnt = fechaLocal(new Date(hoyD.getFullYear(), hoyD.getMonth() - 1, 1)).slice(0, 7);
  const ym = mesActual();
  DB.compras = [
    { id: uid(), fecha: ym + '-03', proveedor: 'Proveedor de helado', proveedorId: 'pv1',
      detalle: '11 balde(s) de varios sabores', cantidad: 11, costoUnitario: 44150, total: 485650,
      medio: 'Transferencia', estado: 'pagado', comprobante: 'R-0012', vencimiento: null, usuario: 'Administración' },
    { id: uid(), fecha: ym + '-02', proveedor: 'Distribuidora descartables', proveedorId: 'pv2',
      detalle: 'Vasos, potes y cucharitas', cantidad: 1, costoUnitario: 96400, total: 96400,
      medio: null, estado: 'pendiente', comprobante: 'F-8841',
      vencimiento: ym + '-20', usuario: 'Administración' },
    { id: uid(), fecha: mesAnt + '-14', proveedor: 'Proveedor de helado', proveedorId: 'pv1',
      detalle: '9 balde(s)', cantidad: 9, costoUnitario: 44150, total: 397350,
      medio: 'Transferencia', estado: 'pagado', comprobante: '', vencimiento: null, usuario: 'Administración' }
  ];
  DB.gastos = [
    { id: uid(), fecha: ym + '-05', tipo: 'operativo', categoria: 'Electricidad', monto: 82000,
      medio: 'Transferencia', descripcion: 'Boleta EPE', usuario: 'Administración' },
    { id: uid(), fecha: ym + '-04', tipo: 'operativo', categoria: 'Limpieza', monto: 24500,
      medio: 'Efectivo', descripcion: 'Insumos de limpieza', usuario: 'Administración' },
    { id: uid(), fecha: ym + '-02', tipo: 'inversion', categoria: 'Otros', monto: 340000,
      medio: 'Transferencia', descripcion: 'Cafetera nueva', usuario: 'Administración' }
  ];
  DB.pagos = [];
  for (let s = 1; s <= 2; s++) {
    DB.pagos.push({ id: uid(), fecha: `${ym}-${String(s * 7 - 4).padStart(2, '0')}`, tipo: 'semanal',
      importe: DB.config.pagoSemanal, medio: 'Transferencia', estado: 'pagado',
      nota: `Semana ${s}`, usuario: 'Administración' });
  }
  DB.inversiones = [
    { id: uid(), clase: 'bien', descripcion: 'Pozo de frío / gustero', aportadoPor: 'Encargada',
      monto: 0, fecha: mesAnt + '-01', observacion: 'Lo trajo ella, sigue siendo suyo', usuario: 'Administración' }
  ];
  DB.movStock = [];
  DB.auditoria = [{ id: uid(), fecha: ahoraLocal(), usuario: 'sistema',
    accion: 'Datos de demostración cargados', detalle: `${ventas.length} operaciones de ejemplo`,
    antes: null, despues: null, motivo: null }];
}

/* ---------- 40. ESTADO DE CONEXIÓN ---------- */
function pintarEstadoRed() {
  const off = !navigator.onLine;
  const e = $('#estadoRed');
  e.classList.toggle('oculto', !off);
  if (off) e.textContent = `Sin internet · las ventas se guardan igual${colaSync.length ? ' · ' + colaSync.length + ' pendientes' : ''}`;
  document.body.style.paddingTop = off ? '30px' : '0';
  document.body.classList.toggle('offline', off);
  pintarSync();
}
window.addEventListener('online', () => {
  pintarEstadoRed();
  if (colaSync.length) { toast(`Volvió internet · sincronizando ${colaSync.length}`); vaciarCola(); }
  else toast('Volvió internet');
});
window.addEventListener('offline', pintarEstadoRed);

/* ---------- 41. ARRANQUE ---------- */
function arrancar() {
  cargar();
  pintarLogin();
  pintarEstadoRed();
  iniciarFB();
  const s = sessionStorage.getItem('gelato_sesion');
  if (s) {
    const u = DB.usuarios.find(x => x.id === s && x.activo);
    if (u) {
      usuario = u;
      $('#login').style.display = 'none';
      $('#app').style.display = 'flex';
      pantalla = u.rol === 'admin' ? 'panel' : 'vender';
      render();
    }
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  setInterval(() => { if (FB && colaSync.length && navigator.onLine) vaciarCola(); }, 20000);
}
$('#lpin').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });
arrancar();
</script>
